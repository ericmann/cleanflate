[package]
name = "oracle"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
cleanflate = { version = "0.1.0", path = "../cleanflate" }
libc = "0.2.189"
libz-sys = { version = "1.1.29", features = ["static"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"

[features]
stats = ["cleanflate/stats"]

[dev-dependencies]
cleanflate = { version = "0.1.0", path = "../cleanflate", features = ["test-hooks"] }
proptest = "1"
